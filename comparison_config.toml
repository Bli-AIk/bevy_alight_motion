# Default average and frame thresholds are both set to 0.98
#
# 默认的平均阀值和帧阀值均为0.95
[default]
avg_threshold = 0.95
frame_threshold = 0.95
frame_offset = 0.0

# min_frame_similarity: 单帧最低相似度阈值（默认0.8）
min_frame_similarity = 0.8

# max_failed_rate: 允许失败帧的最大比例（默认0.05，即5%）
max_failed_rate = 0.05

# Basic shape tests
#
# 基础形状测试
[overrides.basic_shape]
avg_threshold = 0.98
frame_threshold = 0.98

[overrides.basic_pivot]
avg_threshold = 0.98
frame_threshold = 0.98

[overrides.basic_group_cutoff]
avg_threshold = 0.98
frame_threshold = 0.98

# Known issues with Resolution Groups (AM export bug)
#
# 已知的分辨率组问题（AM导出错误）
[overrides.basic_resolution_group]
avg_threshold = 0.94
frame_threshold = 0.75

[overrides.basic_resolution_group_ex2]
avg_threshold = 0.90
frame_threshold = 0.70

# Complex examples with speed=0.7 need frame offset for alignment
# 速度=0.7的复杂示例需要帧偏移来对齐
[overrides.complex_examples_2_ex2]
avg_threshold = 0.95
frame_threshold = 0.95
frame_offset = 0.45

[overrides.complex_examples_2_ex1]
avg_threshold = 0.95
frame_threshold = 0.95
frame_offset = 0.45

# complex_examples_2_ex3 needs stricter threshold to ensure stretch formula is correct
# 复杂示例2_ex3需要更严格的阈值来确保拉伸公式正确
[overrides.complex_examples_2_ex3]
avg_threshold = 0.98
frame_threshold = 0.98

[overrides.complex_examples_2_ex4]
avg_threshold = 0.98
frame_threshold = 0.98

# Multi-level group tests need 0.98 threshold to catch group nesting issues
# 多级编组测试需要0.98阈值来捕获编组嵌套问题
[overrides.basic_multi_level_group_ex]
avg_threshold = 0.98
frame_threshold = 0.98


[overrides.basic_multi_level_group_ex2]
avg_threshold = 0.98
frame_threshold = 0.98

# fx_1_ex has dynamic angle animation which is hard to match perfectly
# 特殊情况：动态角度动画难以完美匹配
[overrides.fx_1_ex_stretch_segment]
avg_threshold = 0.90
frame_threshold = 0.90

# basic_gradient uses gradient feature which is not implemented yet
# basic_gradient 使用渐变功能，尚未实现
[overrides.basic_gradient]
skip = true


[overrides.fx_2_gaussian_blur]
skip = true

[overrides.fx_3_grid]
skip = true

[overrides.fx_4_pixelate]
skip = true
