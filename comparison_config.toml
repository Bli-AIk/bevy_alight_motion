# Default average and frame thresholds are both set to 0.98
#
# 默认的平均阀值和帧阀值均为0.95
[default]
avg_threshold = 0.95
frame_threshold = 0.95
frame_offset = 0.0

# Basic shape tests
#
# 基础形状测试
[overrides.basic_shape]
avg_threshold = 0.96
frame_threshold = 0.94

[overrides.basic_pivot]
avg_threshold = 0.98
frame_threshold = 0.98

[overrides.basic_group_cutoff]
avg_threshold = 0.98
frame_threshold = 0.98

# Known issues with Resolution Groups (AM export bug)
#
# 已知的分辨率组问题（AM导出错误）
[overrides.basic_resolution_group]
avg_threshold = 0.94
frame_threshold = 0.75

[overrides.basic_resolution_group_ex2]
avg_threshold = 0.90
frame_threshold = 0.70

# Complex examples with speed=0.7 need frame offset for alignment
# 速度=0.7的复杂示例需要帧偏移来对齐
[overrides.complex_examples_2_ex2]
avg_threshold = 0.95
frame_threshold = 0.95
frame_offset = 0.45

[overrides.complex_examples_2_ex1]
avg_threshold = 0.95
frame_threshold = 0.95
frame_offset = 0.45

# fx_1_ex has dynamic angle animation which is hard to match perfectly
# 特殊情况：动态角度动画难以完美匹配
[overrides.fx_1_ex_stretch_segment]
avg_threshold = 0.90
frame_threshold = 0.90