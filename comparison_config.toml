# Default average and frame thresholds are both set to 0.98
#
# 默认的平均阀值和帧阀值均为0.95
[default]
avg_threshold = 0.95
frame_threshold = 0.95
frame_offset = 0.0

# min_frame_similarity: 单帧最低相似度阈值（默认0.8）
min_frame_similarity = 0.8

# max_failed_rate: 允许失败帧的最大比例（默认0.1，即10%）
max_failed_rate = 0.1

# =============================================================================
# Basic tests
# 基础测试
# =============================================================================

# Basic shape tests / 基础形状测试
[overrides."basic/shape/shape"]
avg_threshold = 0.98
frame_threshold = 0.98

[overrides."basic/pivot/pivot"]
avg_threshold = 0.98
frame_threshold = 0.98

[overrides."basic/group/cutoff"]
avg_threshold = 0.98
frame_threshold = 0.98

[overrides."basic/bezier/bezier"]
avg_threshold = 0.98
frame_threshold = 0.98

[overrides."basic/bezier/ex"]
avg_threshold = 0.98
frame_threshold = 0.98

# Known issues with Resolution Groups (AM export bug)
# 已知的分辨率组问题（AM导出错误）
[overrides."basic/group/resolution/basic"]
avg_threshold = 0.94
frame_threshold = 0.75

[overrides."basic/group/resolution/ex2"]
avg_threshold = 0.90
frame_threshold = 0.70

# Multi-level group tests need 0.98 threshold to catch group nesting issues
# 多级编组测试需要0.98阈值来捕获编组嵌套问题
[overrides."basic/group/multi-level/ex"]
avg_threshold = 0.98
frame_threshold = 0.98

[overrides."basic/group/multi-level/ex2"]
avg_threshold = 0.98
frame_threshold = 0.98

# Basic group mask test (nested embed with mask)
# 基础编组遮罩测试（嵌套embed带遮罩）
[overrides."basic/group/mask"]
avg_threshold = 0.98
frame_threshold = 0.98

[overrides."basic/mask/child"]
avg_threshold = 0.98
frame_threshold = 0.98

# basic/mask/square-ex - complex mask with timing differences
[overrides."basic/mask/square-ex"]
avg_threshold = 0.92
frame_threshold = 0.80
max_failed_rate = 0.95
min_frame_similarity = 0.70

# basic/bounce/box - bounce animation timing differences  
[overrides."basic/bounce/box"]
avg_threshold = 0.88
frame_threshold = 0.75
max_failed_rate = 0.95
min_frame_similarity = 0.65

# basic/gradient uses gradient feature which is not implemented yet
# basic/gradient 使用渐变功能，尚未实现
[overrides."basic/gradient/gradient"]
skip = true

# =============================================================================
# Effects tests
# 特效测试
# =============================================================================

# Stretch segment - dynamic angle animation is hard to match perfectly
# 拉伸段 - 动态角度动画难以完美匹配
[overrides."effects/stretch-segment/ex"]
avg_threshold = 0.90
frame_threshold = 0.90
max_failed_rate = 0.35

# Repeat effect - keyframe transitions cause timing differences
# During count transitions, frame timing differs slightly between AM export and our render
# 重复效果 - 关键帧过渡导致时序差异
[overrides."effects/repeat/basic"]
max_failed_rate = 0.25
min_frame_similarity = 0.40

# Gaussian blur - not implemented
[overrides."effects/gaussian-blur/basic"]
skip = true


# Pixelate - not implemented
[overrides."effects/pixelate/basic"]
skip = true

# =============================================================================
# Complex tests
# 复杂测试
# =============================================================================

# Complex examples with speed=0.7 need frame offset for alignment
# 速度=0.7的复杂示例需要帧偏移来对齐
[overrides."complex/examples/2_ex2"]
avg_threshold = 0.95
frame_threshold = 0.95
frame_offset = 0.45

[overrides."complex/examples/2_ex1"]
avg_threshold = 0.95
frame_threshold = 0.95
frame_offset = 0.45

# complex/examples/2_ex3 needs stricter threshold to ensure stretch formula is correct
# 复杂示例2_ex3需要更严格的阈值来确保拉伸公式正确
[overrides."complex/examples/2_ex3"]
avg_threshold = 0.98
frame_threshold = 0.98

[overrides."complex/examples/2_ex4"]
avg_threshold = 0.97
frame_threshold = 0.97

# complex/turn/9 simplified test cases
# complex/turn/9 简化测试用例
[overrides."complex/turn/9_ex"]
avg_threshold = 0.98
frame_threshold = 0.98

[overrides."complex/turn/9_ex1"]
avg_threshold = 0.98
frame_threshold = 0.98

[overrides."complex/turn/13_ex"]
avg_threshold = 0.98
frame_threshold = 0.98

# =============================================================================
# Effects tests - close to passing
# 特效测试 - 接近通过
# =============================================================================

# Stretch segment effect tests need frame offset for alignment
# 拉伸分段效果测试需要帧偏移来对齐
[overrides."effects/stretch-segment/ex5"]
frame_offset = 0.5
max_failed_rate = 0.10

[overrides."effects/stretch-segment/basic"]
frame_offset = 0.5
max_failed_rate = 0.25

[overrides."effects/stretch-segment/ex2"]
