# Default average and frame thresholds are both set to 0.98
#
# 默认的平均阀值和帧阀值均为0.95
[default]
avg_threshold = 0.95
frame_threshold = 0.95
frame_offset = 0.0

# min_frame_similarity: 单帧最低相似度阈值（默认0.8）
min_frame_similarity = 0.8

# max_failed_rate: 允许失败帧的最大比例
max_failed_rate = 0.15

# =============================================================================
# Basic tests
# 基础测试
# =============================================================================

# Basic shape tests / 基础形状测试
[overrides."basic/shape/shape"]
avg_threshold = 0.98
frame_threshold = 0.98

[overrides."basic/muti-shape/muti-shape"]
avg_threshold = 0.98
frame_threshold = 0.98

[overrides."basic/pivot/pivot"]
avg_threshold = 0.98
frame_threshold = 0.98

[overrides."basic/group/cutoff"]
avg_threshold = 0.98
frame_threshold = 0.98

[overrides."basic/bezier/bezier"]
avg_threshold = 0.98
frame_threshold = 0.98

[overrides."basic/bezier/ex"]
avg_threshold = 0.98
frame_threshold = 0.98

# Known issues with Resolution Groups (AM export bug)
# 已知的分辨率组问题（AM导出错误）
[overrides."basic/group/resolution/basic"]
avg_threshold = 0.94
frame_threshold = 0.75

[overrides."basic/group/resolution/ex2"]
avg_threshold = 0.90
frame_threshold = 0.70

[overrides."basic/group/multi-level/ex"]
avg_threshold = 0.98
frame_threshold = 0.98

[overrides."basic/group/multi-level/ex2"]
avg_threshold = 0.98
frame_threshold = 0.98

[overrides."basic/group/mask"]
avg_threshold = 0.98
frame_threshold = 0.98

[overrides."basic/mask/child"]
avg_threshold = 0.98
frame_threshold = 0.98

[overrides."basic/mask/shape_ex"]
avg_threshold = 0.98
frame_threshold = 0.98

# basic/tween/step - step boundary precision issue at frame 4
# AM shows inconsistent behavior at 0.25 boundary for smoothing=0
# (step_base snaps at 0.75 but not at 0.25 with identical within_step value)
# Temporary: lower min_frame_similarity to accommodate this single frame
[overrides."basic/tween/step"]
min_frame_similarity = 0.75

# =============================================================================
# Effects tests
# 特效测试
# =============================================================================

# Stretch segment - dynamic angle animation is hard to match perfectly
# 拉伸段 - 动态角度动画难以完美匹配
[overrides."effects/stretch-segment/ex"]
avg_threshold = 0.90
frame_threshold = 0.90
max_failed_rate = 0.35

# Repeat effect - keyframe transitions cause timing differences
# During count transitions, frame timing differs slightly between AM export and our render
# 重复效果 - 关键帧过渡导致时序差异
[overrides."effects/repeat/basic"]
max_failed_rate = 0.25
min_frame_similarity = 0.40

# Gaussian blur - not implemented
[overrides."effects/gaussian-blur/basic"]
skip = true

[overrides."effects/echo-keyframes/basic"]
frame_offset = 0.2

[overrides."effects/pixelate/bone"]
avg_threshold = 0.98
frame_threshold = 0.98
max_failed_rate = 0
frame_offset = 0.5

# 此示例存在严重不匹配的问题，且当前的帧对比算法必须设为0.999才能保证肉眼看不出差别。不能修改这里的阈值
[overrides."effects/pixelate/bone_single"]
avg_threshold = 0.9985
frame_threshold = 0.9985

[overrides."effects/pixelate/basic"]
avg_threshold = 0.98
frame_threshold = 0.98

[overrides."effects/pixelate/sprite"]
avg_threshold = 0.98
frame_threshold = 0.98

