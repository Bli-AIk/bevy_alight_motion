name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  APP_NAME: bevy_alight_motion

permissions:
  checks: write
  contents: read

jobs:
  test:
    name: Test
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libx11-dev \
            libxi-dev \
            libxinerama-dev \
            libxcursor-dev \
            libgl1-mesa-dev \
            pkg-config \
            mold

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Check formatting
        run: cargo fmt -- --check

      # TODO: Re-enable clippy once warnings are resolved
      # - name: Run clippy
      #   run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo nextest run --verbose

  check-test-data:
    name: Check Test Data Freshness
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check test_results.json exists and is not stale
        run: |
          if [ ! -f test_results.json ]; then
            echo "⚠️ Warning: test_results.json not found"
            echo "Run ./update_docs.sh to generate test results"
            # 不阻止 CI，仅警告
            exit 0
          fi

          # 检查文件是否过期（超过 7 天）
          TIMESTAMP=$(jq -r '.timestamp' test_results.json 2>/dev/null || echo "")
          if [ -z "$TIMESTAMP" ]; then
            echo "⚠️ Warning: Cannot parse timestamp from test_results.json"
            exit 0
          fi

          # 转换时间戳并检查
          TEST_DATE=$(date -d "$TIMESTAMP" +%s 2>/dev/null || echo "0")
          NOW=$(date +%s)
          DAYS_OLD=$(( (NOW - TEST_DATE) / 86400 ))

          if [ "$DAYS_OLD" -gt 7 ]; then
            echo "⚠️ Warning: Test data is $DAYS_OLD days old (threshold: 7 days)"
            echo "Consider running ./update_docs.sh to refresh test results"
          else
            echo "✅ Test data is $DAYS_OLD days old (within 7 day threshold)"
          fi

  deny:
    name: Cargo Deny
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features

  security:
    name: Security Audit
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate lockfile
        run: cargo generate-lockfile
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
