name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'doc/**'
      - 'wasm/**'
      - 'src/**'
      - 'assets/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: doc/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli

      - name: Build WASM
        working-directory: wasm
        run: |
          export BEVY_ASSET_PATH="$(cd .. && pwd)/assets"
          cargo build --target wasm32-unknown-unknown --release
          mkdir -p ../doc/public/wasm
          wasm-bindgen \
            --target web \
            --out-dir ../doc/public/wasm \
            --out-name bevy_alight_motion \
            ./target/wasm32-unknown-unknown/release/bevy_alight_motion_wasm.wasm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci
        working-directory: doc

      - name: Build with VitePress
        run: npm run docs:build
        working-directory: doc

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
