name: Deploy Docs

on:
  push:
    branches: [main]
    tags:
      - 'v*'  # 新版本发布时触发
    paths:
      - 'doc/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: doc/package-lock.json

      # WASM 文件已预编译并提交到代码库，无需 CI 构建
      # 本地构建命令: cd wasm && ./build.sh
      - name: Check WASM files exist and freshness
        run: |
          WASM_FILE="doc/public/wasm/bevy_alight_motion_bg.wasm"
          MAX_AGE_DAYS=7  # WASM 超过此天数视为过旧
          
          if [ ! -f "$WASM_FILE" ]; then
            echo "❌ WASM files not found in doc/public/wasm/"
            echo "   Run 'cd wasm && ./build.sh' locally and commit the output"
            exit 1
          fi
          
          echo "✅ WASM files found"
          ls -lh doc/public/wasm/
          
          # 检查 WASM 文件的最后修改时间（基于 git commit 时间）
          WASM_COMMIT_DATE=$(git log -1 --format="%ct" -- "$WASM_FILE" 2>/dev/null || echo "0")
          CURRENT_DATE=$(date +%s)
          AGE_DAYS=$(( (CURRENT_DATE - WASM_COMMIT_DATE) / 86400 ))
          
          if [ "$WASM_COMMIT_DATE" = "0" ]; then
            echo "⚠️ WASM file not tracked by git (new file?)"
          elif [ "$AGE_DAYS" -gt "$MAX_AGE_DAYS" ]; then
            echo "❌ WASM file is $AGE_DAYS days old (max: $MAX_AGE_DAYS days)"
            echo "   Run 'cd wasm && ./build.sh' locally and commit the output"
            exit 1
          else
            echo "✅ WASM file is $AGE_DAYS days old (within $MAX_AGE_DAYS day limit)"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci
        working-directory: doc

      - name: Build with VitePress
        run: npm run docs:build
        working-directory: doc

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
