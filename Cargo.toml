[package]
name = "bevy_alight_motion"
version = "0.5.1"
edition = "2024"
authors = ["Bli-AIk <haikun2333@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bli-AIk/bevy_alight_motion"
readme = "readme.md"
# Disable auto-discovery to prevent video_utils.rs from being compiled as an example
description = "Bevy plugin for loading and playing Alight Motion project files"
keywords = ["bevy", "animation", "sdf", "alight-motion", "2d"]
categories = ["game-development", "rendering", "multimedia"]
exclude = [
    "target/*",
    ".github/*",
    "*.mp4",
    "doc/*",
    "dev/*",
    "logs/*",
    "reports/*",
    "wasm/*",
    "debug_comparison/*",
    "assets/projects/*",
    # amproj is a separate crate published independently
    "crates/amproj/*",
]
autoexamples = false

[dependencies]
amproj = { path = "crates/amproj", version = "0.1.0" }
bevy = { version = "0.18", default-features = false, features = [
    "std",
    "multi_threaded",
    "async_executor",
    "reflect_auto_register",
    "bevy_asset",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_log",
    "bevy_mesh",
    "bevy_render",
    "bevy_shader",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_text",
    "bevy_window",
    "jpeg",
    "webp",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.39", features = ["serialize"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
thiserror = "2.0"
ttf-parser = "0.25"
fontdb = "0.23"
cosmic-text = "0.19"
owo-colors = "4.3"
bevy-inspector-egui = { version = "0.36.0", optional = true }
bevy_brp_extras = { version = "0.20", optional = true }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
image = "0.25"

# WASM dependencies (only compiled for wasm32 target)
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["console"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[dev-dependencies]
bevy = { version = "0.18", features = ["bevy_winit", "default_font", "x11", "bevy_state"] }
toml = "0.8"

[dependencies.tracing-tracy]
version = "0.11"
optional = true

[features]
default = []
debug = ["bevy-inspector-egui"]
ffi = ["amproj/ffi"]
player-brp = ["dep:bevy_brp_extras", "bevy/bevy_remote"]
video-debug = []
video-comparison = []
frame-test = []
# Headless rendering without a display server (no X11/Wayland/xvfb needed).
# Uses offscreen render target + Vulkan software renderer (llvmpipe).
# 无头渲染模式，无需显示服务器（不需要 X11/Wayland/xvfb）。
headless-render = []

# Tracy profiling with minimal overhead (no GUI)
# Tracy 性能分析，最小开销（无 GUI）
trace_tracy = ["bevy/trace_tracy", "bevy/trace", "dep:tracing-tracy"]
# Tracy profiling with system names visible (uses bevy/debug for ECS names)
# Tracy 性能分析，可见系统名称（使用 bevy/debug 获取 ECS 名称）
debug_tracy = ["trace_tracy", "bevy/debug"]
# Tracy memory allocation profiling
# Tracy 内存分配分析
trace_tracy_memory = ["trace_tracy", "bevy/trace_tracy_memory"]


[[example]]
name = "player"
path = "examples/player.rs"

[[example]]
name = "interactive_bg"
path = "examples/interactive_bg.rs"

[[example]]
name = "bouncing_ball"
path = "examples/bouncing_ball.rs"

[[example]]
name = "generate_docs"
path = "examples/generate_docs.rs"

[[example]]
name = "scan_impl"
path = "examples/scan_impl.rs"
