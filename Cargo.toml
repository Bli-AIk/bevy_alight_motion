[package]
name = "bevy_alight_motion"
version = "0.2.0"
edition = "2024"
authors = ["Bli-AIk <haikun2333@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bli-AIk/bevy_alight_motion"
# Disable auto-discovery to prevent video_utils.rs from being compiled as an example
description = "Bevy plugin for loading and playing Alight Motion project files"
exclude = [
    "target/*",
    ".github/*",
    "*.mp4"
]
autoexamples = false

[dependencies]
bevy = { version = "0.17.2", features = ["jpeg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.39", features = ["serialize"] }
zip = { version = "7.4", default-features = false, features = ["deflate"] }
thiserror = "2.0"
ttf-parser = "0.25"
fontdb = "0.23"
owo-colors = "4.0"
bevy-inspector-egui = { version = "0.35.0", optional = true }
chrono = { version = "0.4", features = ["serde"] }

# WASM dependencies (only compiled for wasm32 target)
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["console"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[dev-dependencies]
bevy = "0.17.2"
image = "0.25"
toml = "0.8"

[features]
default = []
debug = ["bevy-inspector-egui"]
video-debug = []
video-comparison = []

[[example]]
name = "player"
path = "examples/player.rs"

[[example]]
name = "interactive_bg"
path = "examples/interactive_bg.rs"

[[example]]
name = "bouncing_ball"
path = "examples/bouncing_ball.rs"

[[example]]
name = "generate_docs"
path = "examples/generate_docs.rs"

[[example]]
name = "scan_impl"
path = "examples/scan_impl.rs"
